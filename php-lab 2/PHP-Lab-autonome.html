const PHP_LAB_EMBEDDED=[[{"id":1,"title":"Rappels PHP et pages dynamiques","short":"Les fondamentaux","subtitle":"Syntaxe, tableaux, fonctions et formulaires","slides":48,"sections":[{"title":"Du serveur au navigateur","slides":"3, 31–32","items":["PHP est interprété côté serveur. Le navigateur reçoit le résultat généré, généralement du HTML.","Une page dynamique adapte son contenu aux données reçues et aux traitements effectués.","Un bloc commence par \u003c?php. Une instruction se termine généralement par un point-virgule. // et /* … */ commentent le code."],"code":"$nom = \"Anna\"; // une chaîne\n$age = 20;      // un entier\n$prix = 12.5;   // un décimal\n$inscrite = true; // un booléen\necho \"Bonjour \" . $nom;"},{"title":"Conditions et opérateurs","slides":"5–11","items":["= affecte ; == compare les valeurs ; === compare valeur et type. != teste une différence.",">= et \u003c= incluent la borne ; > et \u003c sont stricts.","&& exige deux conditions vraies ; || en exige au moins une ; ! inverse un booléen.","if / elseif / else : seule la première branche vraie est exécutée. Tester le seuil 16 avant le seuil 10."],"code":"if ($note >= 16) {\n    echo \"Très bien\";\n} elseif ($note >= 10) {\n    echo \"Admis\";\n} else {\n    echo \"Non admis\";\n}"},{"title":"Trois boucles à savoir écrire","slides":"12–18","items":["for gère un compteur : initialisation ; condition ; mise à jour.","while teste avant chaque tour et peut ne jamais entrer dans le bloc. Faire évoluer la condition pour éviter une boucle infinie.","foreach parcourt un tableau sans gestion manuelle des indices.","Pour cumuler, initialiser le total ou compteur avant la boucle. Exemple du cours : 12 + 8 + 15 + 20 + 5 = 60 ; trois prix > 10."],"code":"$total = 0;\nforeach ($produits as $nom => $prix) {\n    echo $nom . \" : \" . $prix . \"\u003cbr>\";\n    $total += $prix;\n}"},{"title":"Tableaux indexés et associatifs","slides":"19–24","items":["Un tableau regroupe plusieurs valeurs accessibles par indice ou clé. Les indices implicites commencent à 0.","Un tableau associatif donne un nom explicite à chaque clé ; => associe la clé et sa valeur.","Lire ou modifier avec des crochets. Les noms de clés textuelles s’écrivent entre guillemets."],"code":"$fruits = [\"Pomme\", \"Banane\", \"Orange\"];\n$fruits[1] = \"Fraise\"; // remplace le deuxième\n$etudiant = [\"nom\" => \"Alex\", \"age\" => 20];\necho $etudiant[\"nom\"];"},{"title":"Fonctions : afficher ou renvoyer","slides":"25–30","items":["Une fonction est un bloc réutilisable déclaré avec function puis exécuté lors de son appel.","Les paramètres reçoivent les arguments de l’appel. return fournit une valeur à l’appelant ; echo affiche.","readline() lit une ligne au terminal ; (float) convertit la saisie en nombre décimal. Ce n’est pas une lecture de formulaire."],"code":"function calculerMoyenne($a, $b, $c) {\n    return ($a + $b + $c) / 3;\n}\n$moyenne = calculerMoyenne(12, 15, 9); // 12\necho $moyenne;"},{"title":"Formulaires, GET et POST","slides":"33–40","items":["action désigne le fichier de traitement ; method choisit la méthode d’envoi ; name devient la clé reçue en PHP. id identifie l’élément du document.","GET : paramètres dans l’URL, adapté à une recherche ou un filtre. POST : données dans le corps HTTP, adapté aux soumissions et modifications.","POST ne chiffre pas les données : le transport chiffré repose sur HTTPS. required vérifie côté navigateur, pas toute la validité côté serveur.","isset teste existence et non-nullité, pas le caractère non vide. htmlspecialchars prépare l’affichage HTML."],"code":"if (isset($_GET[\"mot\"])) {\n    $mot = htmlspecialchars($_GET[\"mot\"], ENT_QUOTES, \"UTF-8\");\n    echo \"Vous recherchez : \" . $mot;\n}"},{"title":"Validation et récapitulatif produit","slides":"41–46","items":["trim() retire les espaces en début et fin. ?? fournit un défaut si une valeur manque ou vaut null. is_numeric() teste la numericité.","$_SERVER[\"REQUEST_METHOD\"] permet de connaître la méthode HTTP. \u003c?= … ?> équivaut à un affichage echo.","Échapper les données saisies au moment de les afficher dans du HTML ; la validation numérique n’est pas un échappement."],"code":"$nom = trim($_POST[\"nom\"] ?? \"\");\n$prix = trim($_POST[\"prix\"] ?? \"\");\n$valide = $nom != \"\" && is_numeric($prix) && $prix > 0;\nif ($valide) {\n    echo htmlspecialchars($nom, ENT_QUOTES, \"UTF-8\");\n}"},{"title":"Pièges, extension et points évaluables","slides":"43, 47–48","items":["La diapositive 41 exige un prix > 0 ; la solution 43 accepte zéro avec \u003c 0. Toujours appliquer la règle explicitement fixée par l’énoncé.","La diapositive 43 contient aussi des accolades et un point-virgule manquants ; les exemples PHP Lab sont corrigés.","Les guillemets typographiques des supports ne sont pas des délimiteurs de chaînes PHP valides ; saisir des guillemets droits.","L’extension utilise $_SESSION pour conserver plusieurs produits entre les requêtes d’une même navigation, puis les afficher et sommer leurs prix.","À savoir produire : conditions de seuil, boucle bornée, tableau associatif, cumul, fonction avec return, lecture GET/POST et affichage échappé."],"code":null}],"essential":["Distinguer =, == et ===.","Écrire une boucle sans erreur de borne.","Renvoyer un calcul avec return.","Lire la bonne clé GET/POST et échapper son affichage."]},{"id":2,"title":"Création de classes métiers","short":"Classes et objets","subtitle":"Encapsulation, constructeurs, héritage et statique","slides":32,"sections":[{"title":"Classe et instance","slides":"3–6","items":["Une classe décrit des propriétés et méthodes encapsulées ; un objet est une instance concrète de cette classe.","Une propriété décrit les données ; une méthode représente un comportement. Une méthode s’écrit avec function.","public : accessible depuis l’extérieur. private : accès direct limité à la classe déclarante. protected : accès interne et depuis les classes filles."],"code":"class Personne {\n    private $num;\n    protected $nom;\n    public $societe;\n}"},{"title":"Accesseurs et objet courant","slides":"7–8","items":["$this représente l’objet courant. $this->num désigne sa propriété ; $num seul est une variable locale distincte.","Un getter renvoie une propriété, un setter la modifie. Les méthodes publiques exposent un accès contrôlé aux données privées.","Appeler une méthode d’instance avec $objet->methode(). Chaque instance créée avec new possède ses propres données d’instance."],"code":"public function setNum($nvNum) {\n    $this->num = $nvNum;\n}\npublic function getNum() {\n    return $this->num;\n}"},{"title":"Initialiser un objet","slides":"9–11","items":["new Personne(...) crée une instance et appelle le constructeur défini.","Le nom moderne exact est __construct, avec deux underscores. Certaines diapositives les affichent mal.","Les paramètres doivent être affectés aux propriétés avec $this->. Une classe peut être instanciée sans constructeur explicite ; celui-ci sert ici à son initialisation."],"code":"public function __construct($num, $nom, $societe) {\n    $this->num = $num;\n    $this->nom = $nom;\n    $this->societe = $societe;\n}"},{"title":"Plusieurs formats de création","slides":"12–18","items":["On ne déclare pas deux méthodes __construct de signatures différentes dans une même classe PHP.","La technique du cours utilise func_num_args() pour compter les arguments reçus et func_get_arg($i) pour lire celui d’indice i, à partir de 0.","Dans Personne, trois arguments initialisent les trois données ; deux arguments fixent societe à \"inconnu\". break quitte le switch ; exit(1) arrête l’exécution pour un format non prévu.","Dans Voiture, le format à quatre informations fixe disponible à true. calculerPrixLocation renvoie prixJournalier × nbJours."],"code":"switch (func_num_args()) {\n    case 2:\n        $this->num = func_get_arg(0);\n        $this->nom = func_get_arg(1);\n        $this->societe = \"inconnu\";\n        break;\n}"},{"title":"Héritage et réutilisation","slides":"20–23, 29–30","items":["extends déclare une classe fille. parent:: cible un membre accessible de la mère.","Si la fille définit son constructeur, elle appelle explicitement parent::__construct(...) pour initialiser la partie mère. Le cours place cet appel au début : c’est une convention pédagogique, pas une obligation syntaxique PHP.","Une propriété private de la mère n’est pas directement accessible dans la fille ; un getter public de la mère peut la fournir.","Formateur et Apprenant partagent id, nom et email dans Utilisateur, puis ajoutent spécialité ou formation.","Exemple autonome ci-dessous : Personne reçoit seulement le nom. Ne pas mélanger ce constructeur à un seul paramètre avec l’exemple précédent à trois paramètres."],"code":"class Personne {\n    protected $nom;\n    public function __construct($nom) {\n        $this->nom = $nom;\n    }\n}\nclass Etudiant extends Personne {\n    private $formation;\n    public function __construct($nom, $formation) {\n        parent::__construct($nom);\n        $this->formation = $formation;\n    }\n}"},{"title":"Destruction et références","slides":"24–26","items":["__destruct() est appelé quand l’objet n’a plus de référence ou lors de la fin du script.","Si deux variables référencent le même objet, affecter null à une seule ne détruit pas l’objet encore référencé.","La capture Voiture affiche : création, fin du programme, puis destruction. Éviter de concaténer arbitrairement $this à un texte : la classe présentée ne définit pas de conversion en chaîne."],"code":"public function __destruct() {\n    echo \"Destruction de l’objet\";\n}"},{"title":"Portée de classe : static","slides":"27–28, 31–32","items":["Une propriété static appartient à la classe et est commune à ses instances. Elle est distincte des propriétés d’instance.","Accès interne à une propriété statique : self::$planete, avec $. Appel d’une méthode statique publique : Personne::donnePlanete().","Une méthode statique n’a pas de $this. La diapositive 27 écrit self::planete : il faut corriger en self::$planete.","Le compteur nombreUtilisateurs est incrémenté lors des constructions, pas lors de la lecture du getter. Deux formateurs et trois apprenants donnent cinq créations."],"code":"private static $nombreUtilisateurs = 0;\npublic static function getNombreUtilisateurs() {\n    return self::$nombreUtilisateurs;\n}"},{"title":"Points à savoir écrire","slides":"7–31","items":["Déclarer une classe et choisir une visibilité ; écrire getters et setters.","Initialiser les propriétés avec le bon constructeur ; lire les arguments par indice.","Créer un objet, appeler une méthode ; écrire une fille et appeler le parent.","Déclarer un compteur statique et son getter ; distinguer ->, :: et =>."],"code":null}],"essential":["$this->propriete pour une instance.","__construct et __destruct : deux underscores.","extends puis parent::__construct.","self::$propriete et Classe::methode()."]},{"id":3,"title":"Classes DAO et persistance","short":"DAO et PDO","subtitle":"Stockage, connexion partagée et opérations CRUD","slides":34,"sections":[{"title":"Pourquoi une passerelle ?","slides":"2–8","items":["Les objets en mémoire ont une durée de vie limitée à l’exécution. La persistance conserve leurs informations durablement.","Deux éléments sont nécessaires : un support permanent (base relationnelle ou XML) et une passerelle entre objets et stockage.","Un DAO, objet d’accès aux données, isole cette passerelle. Il gère lecture et mise à jour du stockage.","La création d’une table ne relie pas automatiquement l’objet métier à cette table."],"code":null},{"title":"Couches, couplage et factorisation","slides":"6–16","items":["Placer le SQL dans le métier crée un couplage avec le support. Le DAO permet de changer ce support en réécrivant principalement ses méthodes.","Parcours du cours : utilisateur, interface, classes métier, DAO, base. N couches ne veut pas nécessairement dire N machines.","Le DAO centralise et factorise le code. Un même objet DAO peut gérer plusieurs instances d’une classe métier. Pour une structure importante, le cours suggère un DAO par table.","Les schémas des diapositives 30 et 32 montrent la différence entre métier lié au DAO et application qui connaît elle-même les DAO."],"code":null},{"title":"Connexion technique et PDO","slides":"17–19","items":["PDO signifie PHP Data Objects. C’est l’API PHP présentée pour l’accès aux bases relationnelles.","GestionConnexion fournit la connexion ; les DAO l’utilisent. Le Singleton de l’exemple limite les créations et réutilise cette connexion.","Le constructeur privé empêche new GestionConnexion() depuis l’extérieur. getConnexion() est public statique et réalise une initialisation à la première demande."],"code":"private static $_instance = null;\nprivate static $laConnexion;\nprivate function __construct() {\n    self::$laConnexion = new PDO(\n        \"mysql:host=localhost;dbname=nomBase\", \"login\", \"mdp\"\n    );\n}\npublic static function getConnexion() {\n    if (is_null(self::$_instance)) self::$_instance = new GestionConnexion();\n    return self::$laConnexion;\n}"},{"title":"Deux squelettes de DAO","slides":"20–21","items":["Forme d’instance : propriété privée de connexion, initialisée dans le constructeur, puis appels sur $dao->methode().","Forme statique : méthodes public static, connexion obtenue dans ces méthodes, appels ClasseDAO::methode().","Attention à la variable locale : $_db = … ne remplit pas $this->_db. Les captures comportent cette erreur.","GestionConnexion::liberer() est la méthode du service technique qui remet ses références à null ; ce n’est pas une méthode de PDO. D’autres références PDO peuvent encore subsister."],"code":"class SoireeDAO {\n    private $_db;\n    public function __construct() {\n        $this->_db = GestionConnexion::getConnexion();\n    }\n}"},{"title":"CRUD : contrats à reconnaître","slides":"22–28","items":["Create : ajouter ; paramètres séparés ou objet métier. Le contrat peut renvoyer un booléen de succès ou l’identifiant généré.","Read : renvoyer un objet, une collection ou une donnée calculée. Un finder recherche : findById(id) cible une occurrence ; findAll() lit toute la table.","Update : modifier ; transmettre un identifiant et les nouvelles valeurs ou un objet modifié. Un retour booléen est possible, pas obligatoire.","Delete : supprimer ; transmettre un identifiant ou l’objet concerné. Ne pas confondre suppression persistante et destruction d’un objet en mémoire."],"code":"$personne = $dao->findById(12);\n$personnes = $dao->findAll();"},{"title":"Stratégie 1 : le métier connaît le DAO","slides":"29–31","items":["L’objet métier possède une référence vers son DAO. Il lui délègue sa sauvegarde.","Le programme peut simplement appeler $uneSoiree->sauvegardeToi() sans connaître le DAO.","Correction de la notation dans le support : l’accès à la référence conservée dans l’objet utilise $this->objSoireeDAO, puis ->creer($this)."],"code":"public function sauvegardeToi() {\n    return $this->objSoireeDAO->creer($this);\n}"},{"title":"Stratégie 2 : le programme appelle le DAO","slides":"32–34","items":["L’objet métier ne possède pas de référence au DAO. Le programme connaît l’objet et son DAO et orchestre la sauvegarde.","Le cours privilégie cette stratégie pour la lisibilité et l’isolation de la persistance.","Une fois les DAO en place, l’accès aux tables doit passer par leurs méthodes ; ne pas dupliquer SQL ailleurs."],"code":"$uneSoiree = new Soiree(\"23/03/2021\", \"Observer La Lune\", 30);\n$dao = new SoireeDAO();\n$dao->creer($uneSoiree);"},{"title":"Limites des exemples et points évaluables","slides":"14–15, 19–21, 31–34","items":["Le cours illustre des requêtes SQL construites par concaténation. Elles servent à comprendre la passerelle ; les exercices courts privilégient les appels DAO et ne présentent pas cette concaténation de saisies comme un modèle de validation.","À savoir écrire : initialisation de la connexion dans un attribut, appel statique de GestionConnexion, appels CRUD selon un contrat fourni, accès aux getters, correction des notations d’objet.","À savoir expliquer : persistance, couplage, factorisation, Singleton, formes de DAO et deux stratégies. Le développement d’un CRUD SQL complet n’est pas requis par nos exercices courts."],"code":null}],"essential":["DAO = passerelle métier / stockage.","GestionConnexion fournit PDO ; le DAO l’utilise.","CRUD : créer, lire, modifier, supprimer.","Stratégie 2 : le programme appelle le DAO."]},{"id":4,"title":"Architecture Modèle Vue Contrôleur","short":"Architecture MVC","subtitle":"Responsabilités, navigation et catalogue de films","slides":50,"sections":[{"title":"Trois responsabilités","slides":"3–14","items":["Un patron de conception réutilise une solution générale à un problème récurrent d’organisation.","Modèle : logique métier liée aux données, extraction, organisation et SQL. Il peut utiliser des fonctions ou des classes.","Vue : affiche les données, principalement en HTML ; du PHP de présentation peut parcourir une liste. Pas de requêtes SQL dans la vue.","Contrôleur : reçoit la demande, coordonne le traitement, appelle le modèle puis transmet ses données à la vue. Le navigateur reçoit le HTML généré."],"code":"$etudiants = obtenirLesEtudiants($pdo); // modèle\ninclude(\"vues/liste_etudiants.php\"); // présentation"},{"title":"Lire des données puis les afficher","slides":"8–10","items":["Dans le modèle, query exécute la requête fixe de l’exemple ; fetchAll récupère ses lignes.","Dans la vue, foreach parcourt les données déjà préparées. Le cours utilise aussi la syntaxe foreach (…) : … endforeach;.","L’échappement HTML vu au chapitre 1 reste nécessaire pour les valeurs saisies."],"code":"$sql = \"SELECT * FROM etudiants\";\n$resultat = $pdo->query($sql);\n$etudiants = $resultat->fetchAll();"},{"title":"Vue externe, sous-vues et layout","slides":"15–21","items":["La vue externe est la page complète visible par l’internaute. Elle peut être composée de fragments : header, menu, contenu central et footer.","Les sous-vues communes évitent de répéter l’en-tête, le menu et le pied de page. Les sous-vues liées à la demande présentent un contenu spécifique.","layout.php représente la structure générale et assemble les parties. Les fichiers de vues sont réunis dans vues/ (certains schémas écrivent views/).","La capture de la diapositive 19 écrit layot.php : utiliser un nom cohérent tel que layout.php partout."],"code":"include(\"vues/header.php\");\ninclude(\"vues/menu.php\");\ninclude(\"vues/etudiants/liste.php\");\ninclude(\"vues/footer.php\");"},{"title":"Point d’entrée et sous-contrôleurs","slides":"22–28","items":["index.php est le contrôleur principal du cours. Il charge la connexion, traite les paramètres, oriente la navigation et prépare le layout.","Le menu vise le point d’entrée. controleur sélectionne le sous-contrôleur ; action sélectionne sa fonctionnalité.","Les sous-contrôleurs sont dans controleurs/ et contiennent exclusivement du PHP selon le support. Ils gèrent des cas d’utilisation cohérents.","$_REQUEST[\"controleur\"] est une lecture de paramètre présentée ; l’exemple final privilégie aussi $_GET."],"code":"// Exemple d’URL :\n// index.php?controleur=films&action=liste\n$controleur = $_GET[\"controleur\"] ?? \"films\";\n$action = $_GET[\"action\"] ?? \"liste\";"},{"title":"Choisir une action, préparer la bonne vue","slides":"29–31","items":["Le switch du sous-contrôleur traite chaque action ; break évite la poursuite dans les cas suivants.","modifierProduit reçoit l’identifiant, lit le produit et les catégories, puis inclut la vue de modification.","voirCategories lit les catégories puis inclut leur vue. Le modèle est le seul emplacement des requêtes SQL."],"code":"switch ($action) {\n    case \"voirCategories\":\n        $lesCategories = $laConnexion->getLesCategories();\n        include(\"vues/v_categories.php\");\n        break;\n}"},{"title":"Démarche de construction","slides":"32–40","items":["1. Définir les cas d’utilisation (consulter, ajouter, modifier, supprimer).","2. Imaginer les vues externes. 3. Construire répertoires et fichiers.","4. Écrire index.php, le contrôleur principal. 5. Coder chaque cas d’utilisation.","Le chemin de l’exemple est controleurs/ + nom + .php. file_exists vérifie l’existence, pas l’autorisation. Une application réelle doit contrôler les noms qu’elle accepte d’inclure.","include charge un fichier côté serveur. Le mot redirection dans ce passage désigne une orientation interne ; ce n’est pas une redirection HTTP."],"code":"$controleur = $_GET[\"controleur\"] ?? \"etudiant\";\n$fichier = \"controleurs/\" . $controleur . \".php\";\n// Exercice du cours : tester le chemin avant de le charger.\nif (file_exists($fichier)) { include($fichier); }"},{"title":"Exercice du catalogue de films","slides":"41–49","items":["Modèle Film : obtenirLesFilms(), obtenirUnFilm($id), obtenirFilmsParCategorie($idCategorie), ajouterFilm($donnees).","Vues : liste (titre, réalisateur, année et liens), détails (toutes les informations), formulaire d’ajout (dont catégorie issue de la base).","Actions dans c_films.php : liste, details, categorie, ajouter (formulaire), enregistrer (traitement et ajout).","Le formulaire transmet ses données au contrôleur. Après un ajout, l’exercice demande un retour vers la liste. Le contrôleur films est choisi par défaut."],"code":"$films = $modele->obtenirFilmsParCategorie($idCategorie);\ninclude(\"vues/liste_films.php\");"},{"title":"Tests et pièges à l’examen","slides":"50","items":["Tester liste puis détails, filtrage par catégorie, puis ajout et présence dans la liste actualisée.","Ne pas confondre modèle et base : le modèle est le code qui gère les données. Ne pas confondre contrôleur principal et sous-contrôleur.","Ne pas faire naviguer directement vers un fichier du modèle ou du contrôleur secondaire quand le point d’entrée est imposé.","Préparer les données avant include de la vue ; utiliser le bon identifiant (film ou catégorie) ; garder le SQL dans le modèle."],"code":null}],"essential":["Modèle : données et SQL ; vue : affichage ; contrôleur : coordination.","index.php est le point d’entrée.","controleur choisit le sous-contrôleur ; action la fonctionnalité.","Données avant vue, puis tests des parcours."]}],[{"id":"c1-q001","chapter":1,"slides":[3],"theme":"Exécution","difficulty":"facile","type":"unique","prompt":"Où le script PHP d’une page dynamique est-il exécuté ?","options":[{"id":"0","text":"Sur le serveur","explanation":"Le serveur interprète le PHP et génère la réponse."},{"id":"1","text":"Sur le serveur, mais le code source PHP est ensuite interprété par le navigateur","explanation":"Le serveur envoie le résultat généré ; le navigateur n’interprète pas le PHP."},{"id":"2","text":"Dans le navigateur, avant l’envoi de la requête","explanation":"Le navigateur envoie une demande ; le traitement PHP se fait au serveur."},{"id":"3","text":"Sur le serveur uniquement lors de la création du fichier","explanation":"Le script est exécuté lors des requêtes, pas seulement lors de son écriture."}],"answer":["0"],"explanation":"Le navigateur reçoit le résultat généré, pas le code PHP.","code":null,"essential":true},{"id":"c1-q002","chapter":1,"slides":[3],"theme":"Syntaxe","difficulty":"facile","type":"unique","prompt":"Quel délimiteur ouvre un bloc PHP ?","options":[{"id":"0","text":"\u003c?php","explanation":"C’est la balise ouvrante PHP utilisée dans le cours."},{"id":"1","text":"\u003cphp>","explanation":"Cette forme ne démarre pas un bloc PHP."},{"id":"2","text":"\u003c? php","explanation":"L’espace coupe le marqueur ouvrant et le rend invalide."},{"id":"3","text":"\u003cscript php>","explanation":"Une balise script n’ouvre pas un bloc PHP."}],"answer":["0"],"explanation":"Un bloc commence par \u003c?php et peut se terminer par ?>.","code":null,"essential":true},{"id":"c1-q003","chapter":1,"slides":[4],"theme":"Variables","difficulty":"facile","type":"multiple","prompt":"Quelles affectations sont valides ?","options":[{"id":"0","text":"$age = 20;","explanation":"Le nom commence par $ et la valeur est affectée avec =."},{"id":"1","text":"$prix = 12.5;","explanation":"Le point est le séparateur décimal du littéral."},{"id":"2","text":"age = 20;","explanation":"Le symbole $ manque."},{"id":"3","text":"$prix == 12.5;","explanation":"Il s’agit d’une comparaison, pas d’une affectation."}],"answer":["0","1"],"explanation":"= affecte une valeur. == compare deux valeurs.","code":null,"essential":true},{"id":"c1-q004","chapter":1,"slides":[3],"theme":"Affichage","difficulty":"facile","type":"unique","prompt":"Quel résultat est affiché ?","options":[{"id":"0","text":"Bonjour Anna","explanation":"Le point concatène la chaîne et la variable."},{"id":"1","text":"Bonjour $nom","explanation":"La variable n’est pas à l’intérieur d’une chaîne simple."},{"id":"2","text":"Bonjour . Anna","explanation":"Le point est un opérateur, pas du texte affiché."},{"id":"3","text":"AnnaBonjour","explanation":"La concaténation respecte l’ordre des opérandes."}],"answer":["0"],"explanation":"La concaténation assemble les deux chaînes dans l’ordre.","code":"$nom = \"Anna\";\necho \"Bonjour \" . $nom;","essential":true},{"id":"c1-q005","chapter":1,"slides":[4],"theme":"Types","difficulty":"facile","type":"unique","prompt":"Quelle valeur est un booléen ?","options":[{"id":"0","text":"true","explanation":"true est une valeur booléenne."},{"id":"1","text":"\"true\"","explanation":"Les guillemets en font une chaîne."},{"id":"2","text":"12.5","explanation":"C’est un nombre décimal."},{"id":"3","text":"\"20\"","explanation":"C’est une chaîne contenant des chiffres."}],"answer":["0"],"explanation":"Les booléens true et false ne sont pas entourés de guillemets.","code":null,"essential":true},{"id":"c1-q006","chapter":1,"slides":[3],"theme":"Commentaires","difficulty":"facile","type":"multiple","prompt":"Quelles écritures sont des commentaires PHP ?","options":[{"id": are les paramètres.","Ligne 2 : divise la somme complète par 3.","Ligne 3 : ferme la fonction.","Ligne 4 : récupère le résultat, 12."],"hint":"Les parenthèses portent sur la somme des trois notes.","commonErrors":["Diviser seulement la troisième note.","Afficher la moyenne sans la renvoyer."],"rubric":["Trois paramètres sont utilisés.","La somme complète est divisée par trois.","$moyenne reçoit 12."],"alternatives":[],"context":"","essential":false,"validation":"self"},{"id":"c1-e013","chapter":1,"slides":[36],"theme":"GET","difficulty":"intermediaire","type":"code","prompt":"Si le paramètre GET \"mot\" existe et n’est pas null, affiche sa valeur échappée pour le HTML avec ENT_QUOTES et UTF-8.","answer":"if (isset($_GET[\"mot\"])) {\n    echo htmlspecialchars($_GET[\"mot\"], ENT_QUOTES, \"UTF-8\");\n}","explanation":"Ligne 1 : vérifie l’existence et la non-nullité. Ligne 2 : échappe puis affiche la valeur. Ligne 3 : ferme le test.","lineExplanation":["Ligne 1 : vérifie l’existence et la non-nullité.","Ligne 2 : échappe puis affiche la valeur.","Ligne 3 : ferme le test."],"hint":"Combine isset et htmlspecialchars.","commonErrors":["Utiliser $_POST au lieu de $_GET.","Afficher la saisie brute."],"rubric":["La bonne superglobale et la clé mot sont utilisées.","L’existence est vérifiée.","L’échappement ENT_QUOTES / UTF-8 précède l’affichage."],"alternatives":[],"context":"","essential":false,"validation":"self"},{"id":"c1-e014","chapter":1,"slides":[42,43],"theme":"Validation","difficulty":"difficile","type":"code","prompt":"Récupère $prix depuis POST (défaut chaîne vide), retire ses espaces extérieurs puis affecte à $valide un booléen vrai uniquement pour un nombre strictement positif.","answer":"$prix = trim($_POST[\"prix\"] ?? \"\");\n$valide = is_numeric($prix) && $prix > 0;","explanation":"Ligne 1 : récupère et nettoie une valeur avec défaut. Ligne 2 : exige un nombre et une valeur > 0.","lineExplanation":["Ligne 1 : récupère et nettoie une valeur avec défaut.","Li ":"Visibilité","difficulty":"facile","type":"vrai-faux","prompt":"Vrai ou faux : private donne directement accès à l’attribut dans une classe fille.","options":[{"id":"0","text":"Faux","explanation":"L’accès direct private est réservé à la classe déclarante."},{"id":"1","text":"Vrai","explanation":"Pour un accès direct depuis une fille, on utilise protected dans les exemples du cours."}],"answer":["0"],"explanation":"Une méthode publique de la mère peut fournir un accès contrôlé.","code":null,"essential":true},{"id":"c2-q005","chapter":2,"slides":[5],"theme":"Visibilité","difficulty":"facile","type":"multiple","prompt":"Quelles zones peuvent accéder directement à une propriété protected ?","options":[{"id":"0","text":"La classe qui la déclare","explanation":"L’accès interne est autorisé."},{"id":"1","text":"Ses classes filles","explanation":"protected permet l’accès dans les classes dérivées."},{"id":"2","text":"Tout script ayant créé l’objet avec new","explanation":"new ne contourne pas la visibilité protected."},{"id":"3","text":"Uniquement la classe déclarante, sans ses filles","explanation":"Cette limitation correspond à private, pas à protected."}],"answer":["0","1"],"explanation":"protected ouvre l’accès à la hiérarchie, pas au code extérieur.","code":null,"essential":true},{"id":"c2-q006","chapter":2,"slides":[7],"theme":"Encapsulation","difficulty":"facile","type":"unique","prompt":"Quel est le rôle de cette méthode setNum($nvNum) ?","options":[{"id":"0","text":"Modifier le numéro de l’objet","explanation":"Le setter affecte le paramètre à $this->num."},{"id":"1","text":"Renvoyer le numéro sans le modifier","explanation":"C’est le rôle de getNum."},{"id":"2","text":"Initialiser uniquement une variable locale $num","explanation":"Le setter doit modifier la propriété de l’instance."},{"id":"3","text":"Modifier le numéro de toutes les Personne par défaut","explanation":"num est une donnée d’instance dans cet exemple."}],"answer":["0"],"explanation":"Un setter est une méthode de modification.","code":"class Personne {\n    private $num;\n    public function setNum($nvNum) {\n        $this->num = $nvNum;\n    }\n}","essential":true},{"id":"c2-q007","chapter":2,"slides":[7],"theme":"Encapsulation","difficulty":"facile","type":"unique","prompt":"Personne possède une propriété privée $num. Quel corps de méthode permet à getNum() de renvoyer sa valeur ?","options":[{"id":"0","text":"return $this->num;","explanation":"Il renvoie la propriété de l’instance courante."},{"id":"1","text":"return $num;","explanation":"$num serait une variable locale distincte."},{"id":"2","text":"echo $this->num;","explanation":"Cela affiche au lieu de renvoyer."},{"id":"3","text":"$this->num = 0;","explanation":"Cela modifie la propriété sans la retourner."}],"answer":["0"],"explanation":"Un getter renvoie la valeur de l’attribut.","code":null,"essential":true,"context":"La réponse doit renvoyer l’attribut de l’objet courant, sans l’afficher ni le modifier."},{"id":"c2-q008","chapter":2,"slides":[8],"theme":"Instance","difficulty":"facile","type":"unique","prompt":"Que représente $this dans une méthode d’instance ?","options":[{"id":"0","text":"L’objet courant","explanation":"Il donne accès aux membres de cette instance."},{"id":"1","text":"La classe elle-même sans instance","explanation":"self sert notamment aux accès de classe ; $this représente l’instance."},{"id":"2","text":"La dernière instance créée, quel que soit l’appel","explanation":"Il s’agit de l’objet sur lequel la méthode est appelée."},{"id":"3","text":"Le paramètre reçu par le constructeur","explanation":"Le paramètre et l’objet courant sont distincts."}],"answer":["0"],"explanation":"$this->num désigne le numéro de cet objet.","code":null,"essential":true},{"id":"c2-q009","chapter":2,"slides":[8],"theme":"Instance","difficulty":"facile","type":"unique","prompt":"$personne est un objet dont la méthode publique non statique getNum() renvoie son numéro. Comment appeler cette méthode ?" struct.","code":null,"essential":true},{"id":"c2-q012","chapter":2,"slides":[11],"theme":"Constructeur","difficulty":"intermediaire","type":"unique","prompt":"Dans le constructeur d’un objet, le paramètre $leNom doit initialiser la propriété nom. Quelle affectation convient ?","options":[{"id":"0","text":"$this->nom = $leNom;","explanation":"La propriété de l’objet reçoit le paramètre."},{"id":"1","text":"$nom = $leNom;","explanation":"Cela crée ou modifie une variable locale."},{"id":"2","text":"$this->$leNom = nom;","explanation":"Cela n’affecte pas la propriété nom visée."},{"id":"3","text":"self::nom = $leNom;","explanation":"Cette syntaxe ne désigne pas la propriété d’instance."}],"answer":["0"],"explanation":"Un paramètre et une propriété ne se confondent pas.","code":null,"essential":false},{"id":"c2-q013","chapter":2,"slides":[12],"theme":"Constructeur","difficulty":"facile","type":"vrai-faux","prompt":"Peut-on définir plusieurs méthodes __construct de signatures différentes dans une même classe PHP ?","options":[{"id":"0","text":"Non","explanation":"On ne redéfinit pas plusieurs fois une méthode de même nom dans la classe."},{"id":"1","text":"Oui, comme plusieurs surcharges distinctes","explanation":"Le cours présente une simulation dans un seul constructeur."}],"answer":["0"],"explanation":"Le cours choisit le comportement avec func_num_args et func_get_arg.","code":null,"essential":true},{"id":"c2-q014","chapter":2,"slides":[12],"theme":"Arguments","difficulty":"facile","type":"unique","prompt":"Que renvoie func_num_args() dans une fonction ?","options":[{"id":"0","text":"Le nombre d’arguments effectivement reçus","explanation":"Il permet de choisir un cas dans le constructeur du cours."},{"id":"1","text":"Le premier argument reçu","explanation":"Ce serait func_get_arg(0)."},{"id":"2","text":"Le nombre d’arguments déclarés dans la signature seulement","explanation":"func_num_args compte ceux effectivement reçus à l’appel."},{"id":"3","text":"L’indice du dernier argument reçu","explanation":"Trois arguments ont pour dernier indice 2, mais leur nombre vaut 3."}],"answer":["0"],"explanation":"Cette fonction compte les arguments de l’appel courant.","code":null,"essential":true},{"id":"c2-q015","chapter":2,"slides":[13],"theme":"Arguments","difficulty":"facile","type":"unique","prompt":"Dans le constructeur appelé par new Personne(12, \"Dupont\", \"TechNova\"), quelle valeur fournit func_get_arg(1) ?","options":[{"id":"0","text":"Dupont","explanation":"Le premier argument est à l’indice 0, le deuxième à 1."},{"id":"1","text":"12","explanation":"12 correspond à l’indice 0."},{"id":"2","text":"TechNova","explanation":"TechNova correspond à l’indice 2."},{"id":"3","text":"3","explanation":"3 est le nombre d’arguments."}],"answer":["0"],"explanation":"Les positions commencent à zéro.","code":null,"essential":true,"context":"Le constructeur reçoit les trois arguments dans l’ordre indiqué : numéro, nom, société."},{"id":"c2-q016","chapter":2,"slides":[14],"theme":"Arguments","difficulty":"intermediaire","type":"unique","prompt":"Un constructeur utilise switch (func_num_args()) pour distinguer le nombre d’arguments reçus. Quelle étiquette case traite un appel à deux arguments ?","options":[{"id":"0","text":"case 2","explanation":"Le switch porte sur le nombre d’arguments."},{"id":"1","text":"case 1","explanation":"L’indexation de func_get_arg commence à zéro, mais le nombre reste 2."},{"id":"2","text":"case 3","explanation":"Ce cas traite les trois informations."},{"id":"3","text":"default uniquement","explanation":"Le cas 2 est explicitement prévu."}],"answer":["0"],"explanation":"func_num_args() renvoie le nombre reçu : pour deux arguments, le switch sélectionne case 2. Les indices individuels commencent à 0, mais le nombre vaut bien 2.","code":null,"essential":false},{"id":"c2-q017","chapter":2,"slides":[14,15],"theme":"Arguments","difficulty":"intermediaire","type":"unique","prompt":"Quelle valeur de societe est affectée l 3-q033","chapter":3,"slides":[22],"theme":"CRUD","difficulty":"facile","type":"multiple","prompt":"Quelles opérations appartiennent au CRUD ?","options":[{"id":"0","text":"Read","explanation":"C’est la lecture ou recherche."},{"id":"1","text":"Update","explanation":"C’est la modification."},{"id":"2","text":"Retrieve et Render comme deux opérations distinctes du CRUD","explanation":"Read/Retrieve désigne la lecture ; Render n’est pas une opération CRUD."},{"id":"3","text":"Connect et Disconnect","explanation":"La connexion est technique ; ce ne sont pas les quatre opérations de données."}],"answer":["0","1"],"explanation":"CRUD signifie Create, Read, Update, Delete.","code":null,"essential":true},{"id":"c3-q034","chapter":3,"slides":[23],"theme":"Create","difficulty":"intermediaire","type":"multiple","prompt":"Une soirée contient une date, une nature et un nombre de places. Quelles signatures permettent de transmettre ces informations à une méthode DAO de création ?","options":[{"id":"0","text":"creer($date, $nature, $places)","explanation":"On transmet les valeurs séparées."},{"id":"1","text":"creer($objetSoiree)","explanation":"On transmet un objet métier."},{"id":"2","text":"creer($id) en l’absence de toutes les autres informations requises","explanation":"Dans cet exemple date, nature et places doivent être fournis."},{"id":"3","text":"creer($connexion) uniquement","explanation":"La connexion seule ne contient pas les informations de la soirée."}],"answer":["0","1"],"explanation":"Les données peuvent être transmises séparément ou via un objet.","code":null,"essential":false,"context":"$objetSoiree est un objet métier dont les getters publics donnent accès à ces trois informations."},{"id":"c3-q035","chapter":3,"slides":[24],"theme":"Create","difficulty":"intermediaire","type":"multiple","prompt":"Quels retours peuvent être utiles après une création ?","options":[{"id":"0","text":"Un booléen de réussite","explanation":"Il informe l’appelant du succès ou de l’échec."},{"id":"1","text":"L’identifiant généré","explanation":"Il permet de retrouver l’enregistrement créé."},{"id":"2","text":"Obligatoirement un objet PDO nouvellement créé","explanation":"Ce n’est pas le résultat métier d’une création décrit ici."},{"id":"3","text":"Aucun retour, car une création ne peut jamais être une fonction","explanation":"Le cours autorise explicitement une forme qui renvoie une valeur."}],"answer":["0","1"],"explanation":"Le contrat de la méthode détermine son résultat.","code":null,"essential":false},{"id":"c3-q036","chapter":3,"slides":[25],"theme":"Read","difficulty":"facile","type":"unique","prompt":"Quel groupe décrit trois formes possibles de résultat d’une opération de lecture Read dans un DAO ?","options":[{"id":"0","text":"Un objet, une collection, une donnée calculée","explanation":"Ces trois variantes sont décrites."},{"id":"1","text":"Uniquement un identifiant, un booléen ou rien","explanation":"La lecture peut aussi renvoyer objets, collections et calculs."},{"id":"2","text":"Une insertion, une suppression, une modification","explanation":"Ce sont d’autres opérations CRUD, pas des résultats de lecture."},{"id":"3","text":"Obligatoirement une collection même pour une donnée calculée","explanation":"Le cours distingue explicitement plusieurs formes de retour."}],"answer":["0"],"explanation":"Le retour dépend de ce qui est recherché.","code":null,"essential":true},{"id":"c3-q037","chapter":3,"slides":[26],"theme":"Finders","difficulty":"facile","type":"unique","prompt":"Dans un DAO, une méthode de recherche s’appelle findById($id). Quel est le contrat habituel correspondant à ce nom ?","options":[{"id":"0","text":"Rechercher l’enregistrement désigné par son identifiant","explanation":"L’identifiant sélectionne une occurrence unique."},{"id":"1","text":"Renvoyer tous les tuples sans filtre","explanation":"C’est findAll."},{"id":"2","text":"Supprimer l’enregistrement","explanation":"C’est une opération Delete."},{"id":"3","text":"Créer un identifiant dans chaque vue","explanation":"Ce n’est pas un finder."}],"answer":["0"],"explanation":"Un finder est une méthode de recherche.","code":null,"essential":true},{"id":"c3-q038","chapter":3,"slides":[26],"theme":"Finders","difficulty":"facile","type":"unique","prompt":"Un DAO utilise les noms findById, findAll, creer et detruire pour ses opérations. Quelle méthode choisir pour lire tous les enregistrements ?","options":[{"id":"0","text":"findAll()","explanation":"Elle recherche tous les tuples."},{"id":"1","text":"findById($id)","explanation":"Elle cible un identifiant."},{"id":"2","text":"creer($objet)","explanation":"Elle ajoute une occurrence."},{"id":"3","text":"detruire($id)","explanation":"Elle supprime une occurrence."}],"answer":["0"],"explanation":"findAll et findById diffèrent par leur sélection.","code":null,"essential":true},{"id":"c3-q039","chapter":3,"slides":[25],"theme":"Read","difficulty":"intermediaire","type":"unique","prompt":"Une méthode renvoie le nombre de places réservées. À quelle famille appartient-elle ?","options":[{"id":"0","text":"Read","explanation":"C’est une donnée calculée lue."},{"id":"1","text":"Create","explanation":"Aucune création n’est décrite."},{"id":"2","text":"Update","explanation":"Aucune donnée n’est modifiée."},{"id":"3","text":"Delete","explanation":"Aucune suppression n’est décrite."}],"answer":["0"],"explanation":"Une lecture peut renvoyer un calcul, pas seulement des objets.","code":null,"essential":false},{"id":"c3-q040","chapter":3,"slides":[27],"theme":"Update","difficulty":"intermediaire","type":"multiple","prompt":"Quels paramètres peuvent être prévus pour une modification ?","options":[{"id":"0","text":"Un identifiant et les nouvelles valeurs","explanation":"L’identifiant cible la donnée et les valeurs décrivent le changement."},{"id":"1","text":"Un objet métier contenant les modifications","explanation":"C’est la seconde variante citée."},{"id":"2","text":"Uniquement l’identifiant sans aucune e organisation, qui connaît directement le DAO ?","options":[{"id":"0","text":"L’objet métier","explanation":"Il possède une référence au DAO et gère sa sauvegarde via lui."},{"id":"1","text":"Seulement le programme, jamais l’objet métier","explanation":"Dans cette autre organisation, le programme principal connaît le DAO et l’objet métier reste indépendant."},{"id":"2","text":"Chaque enregistrement de la base connaît le DAO PHP","explanation":"Le schéma porte sur les références entre objets de l’application."},{"id":"3","text":"La connexion PDO qui appelle elle-même le métier","explanation":"PDO est utilisé par le DAO ; il ne pilote pas les objets métier."}],"answer":["0"],"explanation":"Le programme utilisateur des objets métier peut ignorer le DAO.","code":null,"essential":false},{"id":"c3-q044","chapter":3,"slides":[31],"theme":"Stratégie 1","difficulty":"intermediaire","type":"unique","prompt":"Soiree possède sauvegardeToi(), qui appelle son propre DAO pour s’enregistrer. Quel appel permet au programme de demander une sauvegarde sans manipuler le DAO lui-même ?","options":[{"id":"0","text":"$uneSoiree->sauvegardeToi();","explanation":"L’objet métier délègue à son DAO."},{"id":"1","text":"$dao->creer($uneSoiree); directement","explanation":"Cela illustre la stratégie 2 au niveau du programme."},{"id":"2","text":"echo $uneSoiree;","explanation":"Ce n’est pas un appel de persistance."},{"id":"3","text":"new SoireeDAO() uniquement","explanation":"Créer le DAO seul ne demande pas la sauvegarde."}],"answer":["0"],"explanation":"L’objet métier connaît et utilise sa passerelle.","code":null,"essential":false,"context":"$uneSoiree est une instance de Soiree. sauvegardeToi() est une méthode publique d’instance."},{"id":"c3-q045","chapter":3,"slides":[32],"theme":"Stratégie 2","difficulty":"intermediaire","type":"unique","prompt":"Le programme appelle un DAO avec un objet métier ; cet objet ne possède aucune référence au DAO. Quel avantage apporte cette organisation ?","options":[{"id":"0","text":"Une meilleure isolation de la persistance","explanation":"L’objet métier ne possède pas de référence au DAO."},{"id":"1","text":"L’absence de tout DAO dans le programme","explanation":"Le programme connaît et appelle bien le DAO ; c’est l’objet métier qui n’en garde pas de référence."},{"id":"2","text":"Une meilleure isolation obtenue en recopiant le SQL dans le métier","explanation":"Cela produit au contraire du couplage."},{"id":"3","text":"Une sauvegarde automatique dès new Soiree","explanation":"Créer une soirée ne l’enregistre pas automatiquement : le programme doit appeler le DAO."}],"answer":["0"],"explanation":"L’objet métier reste indépendant de la passerelle de persistance. Le programme coordonne les appels au DAO, ce qui isole mieux les responsabilités.","code":null,"essential":false},{"id":"c3-q046","chapter":3,"slides":[33],"theme":"Stratégie 2","difficulty":"intermediaire","type":"unique","prompt":"On veut garder Soiree indépendante de tout DAO et confier la sauvegarde au programme principal. Quelle séquence correspond à ce choix ?","options":[{"id":"0","text":"Créer une Soiree, créer un SoireeDAO, appeler creer($soiree)","explanation":"Le programme appelle le DAO avec l’objet métier."},{"id":"1","text":"Faire Soiree appeler son propre DAO via sauvegardeToi","explanation":"Si Soiree appelle son propre DAO, elle connaît la passerelle, contrairement au choix annoncé."},{"id":"2","text":"Faire le programme écrire INSERT sans utiliser le DAO","explanation":"Cela contourne la passerelle."},{"id":"3","text":"Faire le constructeur métier créer directement PDO","explanation":"Cela lie le métier à la persistance."}],"answer":["0"],"explanation":"Le programme crée les deux objets puis transmet la soirée à $dao->creer($soiree). La classe Soiree n’a pas besoin de conserver le DAO.","code":null,"essential":false},{"id":"c3-q047","chapter":3,"slides":[34],"theme":"Centralisation","difficulty":"facile","type":"unique","prompt":"Après mise en place des DAO, comment le reste de l’application doit-il accéder à une table ?","options":[{"id":"0","text":"Via les méthodes du DAO correspondant","explanation":"Le DAO devient le point de passage prévu."},{"id":"1","text":"Par une requête SQL directe dans chaque classe métier","explanation":"Cela contourne l’isolation du DAO."},{"id":"2","text":"En lisant directement les propriétés privées de la connexion","explanation":"Les méthodes du DAO constituent l’interface prévue."},{"id":"3","text":"En créant un PDO dans chaque vue qui en a besoin","explanation":"Cela disperse l’accès aux données et contourne les DAO."}],"answer":["0"],"explanation":"L’accès aux données doit passer par les méthodes des DAO pour garder la persistance centralisée.","code":null,"essential":true},{"id":"c3-q048","chapter":3,"slides":[19],"theme":"Syntaxe","difficulty":"intermediaire","type":"unique","prompt":"Dans une méthode statique de GestionConnexion, quelle expression lit la propriété statique $laConnexion de cette classe ?","options":[{"id":"0","text":"self::$laConnexion","explanation":"Une propriété statique exige le dollar."},{"id":"1","text":"self::laConnexion","explanation":"Cela désigne un nom de constante."},{"id":"2","text":"$this->laConnexion dans une méthode statique","explanation":"Aucun $this n’est disponible ici."},{"id":"3","text":"self->laConnexion","explanation":"L’opérateur de portée de classe est ::."}],"answer":["0"],"explanation":"La syntaxe est identique aux propriétés statiques du chapitre 2.","code":null,"essential":false},{"id":"c3-q049","chapter":3,"slides":[14,33],"theme":"Syntaxe","difficulty":"difficile","type":"unique","prompt":"Quel défaut empêche les autres méthodes de retrouver la connexion dans ce DAO ?","options":[{"id":"0","text":"Le constructeur affecte une variable locale","explanation":"Il faut $this->_db = GestionConnexion::getConnexion();"},{"id":"1","text":"La connexion doit être publique pour être accessible aux méthodes de la classe","explanation":"private autorise bien l’accès interne à cette classe."},{"id":"2","text":"La connexion doit être une propriété de Soiree et non du DAO","explanation":"Le DAO d’instance est précisément censé la conserver."},{"id":"3","text":"Le constructeur doit appeler getConnexion avec -> sur le nom de classe","explanation":"Le point d’accès de GestionConnexion est statique."}],"answer":["0"],"explanation":"La propriété et la variable locale sont distinctes.","code":"class SoireeDAO {\n private $_db;\n public function __construct() {\n   $_db = GestionConnexion::getConnexion();\n }\n}","essential":false},{"id":"c3-q050","chapter":3,"slides":[19,21],"theme":"Connexion","difficulty":"difficile","type":"unique","prompt":"GestionConnexion définit public static function liberer(). Quelle instruction appelle correctement cette méthode ?","options":[{"id":"0","text":"GestionConnexion::liberer();","explanation":"C’est la méthode statique de la classe technique."},{"id":"1","text":"$pdo->liberer();","explanation":"PDO ne possède pas cette méthode personnalisée."},{"id":"2","text":"echo liberer;","explanation":"Ce n’est pas un appel de méthode."},{"id":"3","text":"new liberer();","explanation":"liberer n’est pas une classe."}],"answer":["0"],"explanation":"Une diapositive appelle liberer sur la connexion ; la méthode montrée appartient à GestionConnexion.","code":null,"essential":false},{"id":"c3-e001","chapter":3,"slides":[20],"theme":"DAO instance","difficulty":"facile","type":"code","prompt":"Déclare PersonneDAO avec une propriété privée laConnexion, initialisée dans son constructeur par GestionConnexion::getConnexion().","answer":"class PersonneDAO {\n    private $laConnexion;\n    public function __construct() {\n        $this->laConnexion = GestionConnexion::getConnexion();\n    }\n}","explanation":"Lignes 1–2 : déclarent le DAO et son attribut. Ligne 3 : déclare le constructeur. Ligne 4 : conserve la connexion dans l’objet. Lignes 5–6 : ferment les blocs.","lineExplanation":["Lignes 1–2 : déclarent le DAO et son attribut.","Ligne 3 : déclare le constructeur.","Ligne 4 : conserve la connexion dans l’objet.","Lignes 5–6 : ferment les blocs."],"hint":"La connexion doit rester accessible aux autres méthodes.","commonErrors":["Laisser la connexion dans une variable locale.","Instancier directement GestionConnexion dont le constructeur est privé."],"rubric":["Le DAO est déclaré.","La connexion est une propriété privée.","Le constructeur affecte cette propriété avec le service technique."],"alternatives":[],"context":"GestionConnexion existe et sa méthode publique statique getConnexion() renvoie PDO. Écris la classe DAO complète, sans implémenter d’opération CRUD.","essential":true,"validation":"self"},{"id":"c3-e002","chapter":3,"slides":[19],"theme":"Connexion","difficulty":"facile","type":"code","prompt":"Obtiens la connexion partagée et conserve-la dans $pdo.","answer":"$pdo = GestionConnexion::getConnexion();","explanation":"Ligne 1 : appelle le point d’accès statique et conserve son retour.","lineExplanation":["Ligne 1 : appelle le point d’accès statique et conserve son retour."],"hint":"L’appel se fait sur la classe technique.","commonErrors":["Utiliser new GestionConnexion.","Oublier l’affectation."],"rubric":["L’appel vise GestionConnexion.","getConnexion est appelé avec ::.","$pdo reçoit le résultat."],"alternatives":[],"context":"GestionConnexion existe. Elle propose public static function getConnexion(), qui renvoie la connexion PDO partagée. Écris uniquement l’appel et son affectation.","essential":true,"validation":"self"},{"id":"c3-e003","chapter":3,"slides":[19],"theme":"PDO","difficulty":"intermediaire","type":"code","prompt":"Écris l’instruction créant $pdo pour MySQL sur localhost, base nomBase, identifiant login et mot de passe mdp.","answer":"$pdo = new PDO(\"mysql:host=localhost;dbname=nomBase\", \"login\", \"mdp\");","explanation":"Ligne 1 : crée PDO avec DSN MySQL, identifiant et mot de passe.","lineExplanation":["Ligne 1 : crée PDO avec DSN MySQL, identifiant et mot de passe."],"hint":"Le DSN contient le pilote, host et dbname.","commonErrors":["Inverser base et hôte.","Oublier new."],"rubric":["Le DSN cible MySQL et localhost.","La base est nomBase.","login et mdp sont passés dans cet ordre."],"alternatives":[],"context":"","essential":false,"validation":"self"},{"id":"c3-e004","chapter":3,"slides":[19],"theme":"Singleton","difficulty":"facile","type":"code","prompt":"Dans GestionConnexion, déclare les propriétés statiques privées _instance (null) et laConnexion.","answer":"private static $_instance = null;\nprivate static $laConnexion;","explanation":"Ligne 1 : initialise la référence de contrôle. Ligne 2 : prévoit l’emplacement de PDO.","lineExplanation":["Ligne 1 : initialise la référence de contrôle.","Ligne 2 : prévoit l’emplacement de PDO."],"hint":"Les deux valeurs sont à portée de classe.","commonErrors":["Créer des propriétés d’instance.","Oublier $ dans le nom."],"rubric":["Les deux propriétés existent.","Elles sont privées statiques.","_instance est initialisée à null."],"alternatives":[],"context":"Fragment à l’intérieur de GestionConnexion.","essential":true,"validation":"self"},{"id":"c3-e005","chapter":3,"slides":[19],"theme":"Singleton","difficulty":"intermediaire","type":"code","prompt":"Dans getConnexion(), instancie GestionConnexion uniquement si self::$_instance est null.","answer":"if (is_null(self::$_instance)) {\n    self::$_instance = new GestionConnexion();\n}","explanation":"Ligne 1 : teste l’absence d’instance. Ligne 2 : initialise seulement dans ce cas. Ligne 3 : ferme le test.","lineExplanation":["Ligne 1 : teste l’absence d’instance.","Ligne 2 : initialise seulement dans ce cas.","Ligne 3 : ferme le test."],"hint":"La création reste interne à la classe.","commonErrors":["Instancier à chaque appel sans test.","Utiliser $this dans une méthode statique."],"rubric":["La nullité est testée.","L’instanciation est conditionnelle.","L’instance est conservée d leur introuvable.\".","answer":"if (file_exists($fichier)) {\n    include($fichier);\n} else {\n    echo \"Contrôleur introuvable.\";\n}","explanation":"Ligne 1 : teste le chemin. Ligne 2 : charge le fichier existant. Lignes 3–5 : prévoient le cas manquant.","lineExplanation":["Ligne 1 : teste le chemin.","Ligne 2 : charge le fichier existant.","Lignes 3–5 : prévoient le cas manquant."],"hint":"file_exists teste ; include charge.","commonErrors":["Confondre include et redirection HTTP.","Croire que l’existence vaut autorisation d’accès."],"rubric":["L’existence est testée.","Le bon fichier est inclus.","Le cas absent affiche le message."],"alternatives":[],"context":"Le chemin est déjà sélectionné parmi les contrôleurs de l’application.","essential":false,"validation":"self"},{"id":"c4-e004","chapter":4,"slides":[12],"theme":"Contrôleur","difficulty":"facile","type":"code","prompt":"Dans le contrôleur, récupère les étudiants avec obtenirLesEtudiants($pdo) dans $etudiants puis inclus vues/liste_etudiants.php.","answer":"$etudiants = obtenirLesEtudiants($pdo);\ninclude(\"vues/liste_etudiants.php\");","explanation":"Ligne 1 : obtient les données du modèle. Ligne 2 : appelle la présentation une fois les données prêtes.","lineExplanation":["Ligne 1 : obtient les données du modèle.","Ligne 2 : appelle la présentation une fois les données prêtes."],"hint":"Le modèle est appelé avant la vue.","commonErrors":["Inclure la vue avant d’avoir les données.","Mettre SELECT dans la vue."],"rubric":["La fonction modèle reçoit $pdo.","Son retour est affecté à $etudiants.","La vue demandée est incluse ensuite."],"alternatives":[],"context":"La fonction du modèle obtenirLesEtudiants($pdo) existe et renvoie la liste. $pdo est une connexion déjà disponible ; la vue vues/liste_etudiants.php utilise la variable $etudiants.","essential":true,"validation":"self"},{"id":"c4-e005","chapter":4,"slides":[8],"theme":"Modèle","difficulty":"intermediaire","type":"code","prompt":"Dans le modèle, lis 07","chapter":4,"slides":[17,19],"theme":"Layout","difficulty":"facile","type":"code","prompt":"Dans layout.php, inclus dans l’ordre vues/header.php, vues/menu.php, vues/etudiants/liste.php, vues/footer.php.","answer":"include(\"vues/header.php\");\ninclude(\"vues/menu.php\");\ninclude(\"vues/etudiants/liste.php\");\ninclude(\"vues/footer.php\");","explanation":"Ligne 1 : affiche l’en-tête. Ligne 2 : insère la navigation. Ligne 3 : place la liste au centre. Ligne 4 : termine par le pied de page.","lineExplanation":["Ligne 1 : affiche l’en-tête.","Ligne 2 : insère la navigation.","Ligne 3 : place la liste au centre.","Ligne 4 : termine par le pied de page."],"hint":"L’ordre des inclusions suit celui de la page.","commonErrors":["Placer le footer avant le contenu.","Confondre controleurs et vues."],"rubric":["Les quatre sous-vues sont incluses.","Les chemins sont cohérents.","L’ordre demandé est respecté."],"alternatives":[],"context":"","essential":true,"validation":"self"},{"id":"c4-e008","chapter":4,"slides":[28],"theme":"Paramètres","difficulty":"facile","type":"code","prompt":"Récupère le paramètre REQUEST action dans $action ; utilise \"liste\" par défaut.","answer":"$action = $_REQUEST[\"action\"] ?? \"liste\";","explanation":"Ligne 1 : récupère la fonctionnalité demandée avec un repli.","lineExplanation":["Ligne 1 : récupère la fonctionnalité demandée avec un repli."],"hint":"Il s’agit de l’action, pas du nom du contrôleur.","commonErrors":["Lire controleur à la place.","Traiter REQUEST comme une fonction."],"rubric":["La superglobale est REQUEST.","La clé est action.","Le défaut est liste."],"alternatives":[],"context":"","essential":true,"validation":"self"},{"id":"c4-e009","chapter":4,"slides":[29],"theme":"Actions","difficulty":"difficile","type":"code","prompt":"Écris un switch sur $action : pour voirCategories, appelle $laConnexion->getLesCategories() dans $lesCategories, inclus vues/v_categories.php puis sors du switch.","answer":"switch ($action) {\n function shuffle(values, rng = Math.random) {
  const out = [...values];
  for (let i = out.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [out[i], out[j]] = [out[j], out[i]]; }
  return out;
}

const EXAM_CHAPTERS = Object.freeze([2, 3]);
const EXAM_COUNTS = Object.freeze({qcm: 10, code: 2});

// Les anciens examens restent lisibles sans élargir le périmètre des nouveaux.
function hasExamComposition(items, byId, chapterIds = EXAM_CHAPTERS) {
  if (!Array.isArray(chapterIds) || ![[2, 3], [1, 2, 3, 4]].some(scope =>
    scope.length === chapterIds.length && scope.every((id, i) => id === chapterIds[i]))) return false;
  if (items.length !== 24 || new Set(items.map(item => item.id)).size !== 24) return false;
  const questions = items.map(item => byId.get(item.id));
  if (questions.some(q => !q || !chapterIds.includes(q.chapter))) return false;
  return chapterIds.every(chapter =>
    questions.filter(q => q.chapter === chapter && q.type !== 'code').length === 20 / chapterIds.length &&
    questions.filter(q => q.chapter === chapter && q.type === 'code').length === 4 / chapterIds.length);
}

function generateExam(bank, config = {}) {
  const selected = [];
  for (const chapter of EXAM_CHAPTERS) {
    const qcm = shuffle(bank.filter(q => q.chapter === chapter && q.type !== 'code'));
    const code = shuffle(bank.filter(q => q.chapter === chapter && q.type === 'code'));
    if (qcm.length < EXAM_COUNTS.qcm || code.length < EXAM_COUNTS.code)
      throw new Error(`Banque insuffisante au chapitre ${chapter}.`);
    selected.push(...qcm.slice(0, EXAM_COUNTS.qcm), ...code.slice(0, EXAM_COUNTS.code));
  }
  if (config.previousIds?.length === 24 && selected.every(q => config.previousIds.includes(q.id))) {
    const chapter = EXAM_CHAPTERS[0];
    const alternative = bank.find(q => q.chapter === chapter && q.type !== 'code' && !config.previousIds.includes(q.id));
    if (alternative) selected[selected.findIndex(q => q.chapter === chapter && q.type !== 'code')] = alternative;
  }
  const session = makeSession(selected, {...config, mode: 'exam', title: 'Examen blanc · chapitres 2 et 3', immediate: false});
  session.examChapters = [...EXAM_CHAPTERS];
  return session;
}

async function begin(session){if(state.current?.status==='active'||state.current?.status==='submitted'&&sessionScore(state.current,byId).pending){if(!await confirmDialog('Remplacer la session en cours ?', 'La nouvelle session remplacera la session sauvegardée. Tu peux annuler pour reprendre tes réponses.','Remplacer'))return;}session.marked=state.favorites.filter(id=>session.items.some(i=>i.id===id));state.current=session;persist();location.hash='/session';if(route==='session')render();}

function sessionPage(){const s=state.current;if(!s||s.status!=='active'){location.hash=s?'results':'dashboard';return '';}const item=s.items[s.index],q=byId.get(item.id),answered=s.items.filter(i=>isAnswered(byId.get(i.id),s.answers[i.id])).length,revealed=s.revealed.includes(q.id),a=s.answers[q.id];return `<div class="session-top"><div><p class="eyebrow">${e(s.title)}</p><h1>Question ${s.index+1}<span class="muted"> / ${s.items.length}</span></h1></div><div class="session-clock">${icon('clock')}<strong id="session-timer">${time(s.duration?remainingSeconds(s):elapsedSeconds(s))}</strong><span>${s.duration?'restantes':'écoulées'}</span></div></div>${progress(answered/s.items.length*100)}<p class="session-progress" id="answered-count">${answered} / ${s.items.length} réponses saisies</p><div class="session-layout"><section class="question panel">${tags(q)}<h2>${e(q.prompt)}</h2>${q.type==='multiple'?'<p class="format-note">Plusieurs réponses attendues. Sélectionne toutes les propositions correctes.</p>':''}${q.context?`<p class="context">${e(q.context)}</p>`:''}${q.code?`<pre class="code-block"><code>${highlight(q.code)}</code></pre>`:''}${q.type==='code'?`<div id="editor"></div><p class="editor-note">Saisie PHP · Tab pour indenter · balises &lt;?php facultatives · aucun code exécuté</p>`:`<div class="options" role="${q.type==='multiple'?'group':'radiogroup'}" aria-label="Propositions">${item.order.map((id,idx)=>{const o=q.options.find(o=>o.id===id),selected=Array.isArray(a)&&a.includes(id);return `<button class="option ${selected?'selected':''} ${revealed?(q.answer.includes(id)?'right':selected?'wrong':''):''}" data-action="answer" data-option="${id}" role="${q.type==='multiple'?'checkbox':'radio'}" aria-checked="${selected}" ${revealed?'disabled':''}><span class="option-letter">${String.fromCharCode(65+idx)}</span><span>${e(o.text)}</span><span class="option-selector" aria-hidden="true"></span></button>`;}).join('')}</div>`}<div class="question-tools">${btn(icon('flag')+(s.marked.includes(q.id)?' Marquée':' Marquer pour revenir'),'mark',s.marked.includes(q.id)?'marked':'','aria-pressed="'+s.marked.includes(q.id)+'"')}${s.immediate&&q.type==='code'&&!revealed?btn('Un indice','hint','ghost'):''}${s.immediate&&!revealed?btn(q.type==='code'?'Comparer avec la correction':'Valider ma réponse','check','primary'):''}</div>${s.hints.includes(q.id)&&!revealed?`<div class="notice">${e(q.hint)}</div>`:''}${revealed?correction(q,s):''}<div class="question-nav">${btn('Précédent','prev','',s.index===0?'disabled':'')}${s.index<s.items.length-1?btn('Question suivante','next','primary'):btn('Terminer la session','submit','primary')}</div></section><aside class="session-aside">${panel('Ta feuille de route',`<div class="question-map">${s.items.map((i,idx)=>`<button class="map-button ${idx===s.index?'current':''} ${isAnswered(byId.get(i.id),s.answers[i.id])?'answered':''} ${s.marked.includes(i.id)?'flagged':''}" data-action="goto" data-index="${idx}" aria-label="Question ${idx+1}, ${isAnswered(byId.get(i.id),s.answers[i.id])?'répondue':'non répondue'}${s.marked.includes(i.id)?', marquée':''}" ${idx===s.index?'aria-current="step"':''}>${idx+1}</button>`).join('')}</div><div class="map-legend"><span><i class="answered-dot"></i>Répondue</span><span><i></i>À faire</span><span>◇ Marquée</span></div>${btn(s.mode==='exam'?'Remettre ma copie':'Terminer la session','submit','primary wide')}`)}<p class="keyboard-help"><kbd>1</kbd>–<kbd>4</kbd> Choisir une réponse<br><kbd>←</kbd> <kbd>→</kbd> Naviguer<br><kbd>M</kbd> Marquer · <kbd>Entrée</kbd> Valider en révision</p><p class="muted">${s.mode==='exam'?'Corrections masquées jusqu’à la remise.':'Réponses et progression sauvegardées sur cet appareil.'}</p></aside></div>`;}
