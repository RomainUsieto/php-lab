async function submitSession(expired=false){const s=state.current;if(!s||s.status!=='active')return;const unanswered=s.items.filter(i=>!isAnswered(byId.get(i.id),s.answers[i.id])).length;if(!expired&&!await confirmDialog(s.mode==='exam'?'Remettre la copie ?':'Terminer la session ?',`${unanswered?`${unanswered} question(s) sans réponse. `:''}Après validation, les réponses ne seront plus modifiables et les corrections seront affichées. Les exercices saisis seront auto-évalués.`,s.mode==='exam'?'Remettre la copie':'Terminer'))return;
 if(s.status!=='active')return; s.status='submitted';s.submittedAt=s.duration?Math.min(Date.now(),s.startedAt+s.duration*1000):Date.now();for(const i of s.items){const q=byId.get(i.id);if(q.type!=='code')recordAttempt(state,s,q,exactAnswer(q,s.answers[q.id]));else if(!isAnswered(q,s.answers[q.id])){s.grades[q.id]=0;recordAttempt(state,s,q,false);}}archiveSession(state,s);persist();location.hash='/results';if(expired)toast('Temps écoulé : la copie a été remise automatiquement.');}
function resultPage(){const s=state.current;if(!s||s.status!=='submitted')return heading('RÉSULTATS','Aucune copie remise.','Termine une session pour afficher sa correction.',link('Tableau de bord','dashboard','btn primary'));const score=sessionScore(s,byId);return heading('LE BILAN DE TA SESSION',score.pending?'La correction, puis le progrès.':'Un pas de plus dans le programme.',`${e(s.title)} · ${s.items.length} questions · ${time(elapsedSeconds(s))} utilisées`,link('Tableau de bord','dashboard','btn'))+`<div class="result-overview"><div class="result-score">${fmt(score.score)}<span> / 20</span><small>${score.pending?'Note provisoire':'Note finale'}${score.codeTotal?' · code auto-évalué':''}</small></div><div><h2>${score.pending?`${score.pending} exercice(s) à auto-évaluer`:`${pct(score.percent)} de réussite pondérée`}</h2><p>${score.qcmCorrect} / ${score.qcmTotal} QCM corrects${score.codeTotal?` · ${score.codeTotal} exercices de code`:''}</p><p class="muted">${score.pending?'La note inclut provisoirement 0 pour les exercices non évalués. Ouvre leurs corrections ci-dessous pour terminer ton bilan.':`Barème : ${s.weights.qcm} point(s) par QCM, ${s.weights.code} par exercice ; total ramené à 20.`}</p></div></div><div class="section-heading"><div><h2>Reprendre chaque raisonnement.</h2><p>Les réponses sont définitives pour cette session. Un nouvel entraînement permet de recommencer.</p></div>${link('Revoir mes erreurs','errors','btn')}</div><div class="result-list">${s.items.map((item,idx)=>{const q=byId.get(item.id),a=s.answers[q.id],isCode=q.type==='code',pending=isCode&&s.grades[q.id]===undefined,good=isCode?s.grades[q.id]===1:exactAnswer(q,a);return `<details class="result-item ${pending?'pending':good?'success':'failure'}" id="result-${q.id}" ${pending?'open':''}><summary><span class="result-number">${idx+1}</span><span><small>Chapitre ${q.chapter} · ${labels[q.type]} · ${pending?'à auto-évaluer':good?'correct':'à retravailler'}</small><strong>${e(q.prompt)}</strong></span><span class="result-status">${pending?'…':good?'✓':'×'}</span></summary><div class="result-detail">${tags(q)}${q.context?`<p class="context">${e(q.context)}</p>`:''}${q.code?`<pre class="code-block"><code>${highlight(q.code)}</code></pre>`:''}<h3>Ta réponse</h3>${isCode?`<pre class="code-block"><code>${highlight(a||'// Aucune réponse saisie')}</code></pre>`:`<p>${Array.isArray(a)&&a.length?a.map(id=>e(q.options.find(o=>o.id===id)?.text)).join(' · '):'Aucune réponse'}</p>`}${correction(q,s,true)}</div></details>`;}).join('')}</div>`;}
function errorsPage(){const st=stats(bank,state),items=errorTab==='favorites'?bank.filter(q=>state.favorites.includes(q.id)):st.errors;const themes={};for(const q of st.errors){const key=`C${q.chapter} · ${q.theme}`;themes[key]=(themes[key]||0)+state.progress[q.id].wrong;}return heading('TRANSFORMER L’ERREUR EN RÉFLEXE','Les notions à retravailler.','Les questions ratées sortent de cette liste après trois bonnes réponses consécutives.')+`<div class="tabs">${btn(`Erreurs · ${st.errors.length}`,'error-tab',errorTab==='errors'?'primary':'','data-tab="errors"')}${btn(`Marquées difficiles · ${state.favorites.length}`,'error-tab',errorTab==='favorites'?'primary':'','data-tab="favorites"')}</div>${items.length?`<div class="section-heading"><p>${items.length} questions dans cette liste.</p>${btn('Refaire cette sélection','errors-start','primary')}</div><div class="review-list">${items.map(q=>`<article class="review-row"><div>${tags(q)}<h3>${e(q.prompt)}</h3><p class="muted">${state.progress[q.id]?.streak||0} / 3 bonnes réponses consécutives${state.progress[q.id]?.wrong?` · ${state.progress[q.id].wrong} erreur(s) enregistrée(s)`:''}</p></div><div class="actions">${btn('Refaire','retry-one','',`data-id="${q.id}"`)}${btn(state.favorites.includes(q.id)?'Retirer le marquage':'Marquer difficile','favorite','ghost',`data-id="${q.id}"`)}${btn('Voir la correction','show-correction','ghost',`data-id="${q.id}"`)}</div><div id="review-${q.id}"></div></article>`).join('')}</div>`:`<div class="empty"><span class="empty-icon">${icon('check')}</span><h2>${errorTab==='favorites'?'Aucune question marquée.':'Aucune erreur à retravailler.'}</h2><p>${st.done?'Continue à explorer le programme pour consolider tes acquis.':'Tes erreurs apparaîtront ici après les premières réponses évaluées.'}</p>${link('Commencer un entraînement','custom','btn primary')}</div>`}${Object.keys(themes).length?panel('Les erreurs qui reviennent',`<div class="theme-grid">${Object.entries(themes).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([theme,n])=>`<div class="theme-item"><strong>${e(theme)}</strong><span>${n} réponse(s) incorrecte(s)</span></div>`).join('')}</div>`):''}`;}
function expressPage(){return heading('LES DERNIÈRES MINUTES COMPTENT','L’essentiel, au bon endroit.','Revois les pièges et les syntaxes, puis fais une courte série ciblée.',btn('Lancer 12 questions ciblées','express-start','primary'))+`<div class="notice">La série contient 2 QCM et 1 exercice de code par chapitre. Les erreurs en cours sont prioritaires, puis les notions essentielles du cours.</div><div class="chapter-grid">${chapters.map(c=>panel(`0${c.id} · ${e(c.short)}`,`<ul class="key-list">${c.essential.map(x=>`<li>${e(x)}</li>`).join('')}</ul>${link('Relire la fiche',`sheet/${c.id}`,'text-link')}`)).join('')}</div>${panel('Les cinq pièges à vérifier dans ta copie',`<ol class="key-list"><li>Affectation = ou comparaison == / === ?</li><li>Indice de tableau et argument : le premier est à 0.</li><li>return renvoie ; echo affiche.</li><li>Instance : $this-> ; classe : self::$ et Classe:: ; association : =>.</li><li>SQL dans le modèle ou DAO ; HTML dans la vue ; demande traitée par le contrôleur.</li></ol>`)}`;}
function sheetsPage(){return heading('LES FICHES DU PROGRAMME','Une notion claire se retient mieux.','Quatre fiches détaillées et une dernière lecture avant l’examen.',`${link('L’essentiel avant l’examen','sheet/all','btn primary')}${btn('Imprimer les 5 fiches','print-all','')}`)+`<div class="chapter-grid">${chapters.map(c=>`<a href="#/sheet/${c.id}" class="sheet-card panel"><span class="chapter-label">CHAPITRE 0${c.id} · ${c.slides} DIAPOSITIVES</span><h2>${e(c.title)}</h2><p>${e(c.subtitle)}</p><span class="text-link">Ouvrir la fiche</span></a>`).join('')}</div><p class="muted">Les numéros correspondent à l’ordre des diapositives des quatre PowerPoint fournis. Les coquilles du support sont signalées dans les fiches.</p>`;}
function sheetContent(c){return `<article class="course-sheet"><div class="sheet-title"><p class="eyebrow">CHAPITRE ${c.id}</p><h2>${e(c.title)}</h2><p>${c.slides} diapositives analysées · 50 QCM · 15 exercices</p></div>${c.sections.map(section=>`<section class="sheet-section"><div><h3>${e(section.title)}</h3><span class="source">Diapo. ${e(section.slides)}</span></div><ul>${section.items.map(x=>`<li>${e(x)}</li>`).join('')}</ul>${section.code?`<pre class="code-block"><code>${highlight(section.code)}</code></pre>`:''}</section>`).join('')}</article>`;}
function globalSheet(){return `<article class="course-sheet"><div class="sheet-title"><p class="eyebrow">LA DERNIÈRE LECTURE</p><h2>L’essentiel à connaître avant l’examen</h2></div><section class="sheet-section"><h3>Les syntaxes à retrouver sans hésiter</h3><pre class="code-block"><code>${highlight('$nom = "Anna";\necho "Bonjour " . $nom;\nif ($age >= 18) { echo "Majeur"; }\nfor ($i = 1; $i <= 5; $i++) { echo $i; }\nforeach ($produits as $nom => $prix) { echo $prix; }\nfunction somme($a, $b) { return $a + $b; }\n$nom = trim($_POST["nom"] ?? "");\necho htmlspecialchars($nom, ENT_QUOTES, "UTF-8");\n$p = new Personne();\n$p->setNum(123);\n$pdo = GestionConnexion::getConnexion();\n$action = $_GET["action"] ?? "liste";')}</code></pre></section>${chapters.map(c=>`<section class="sheet-section"><h3>${c.id}. ${e(c.short)}</h3><ul>${c.essential.map(x=>`<li>${e(x)}</li>`).join('')}</ul></section>`).join('')}<section class="sheet-section"><h3>Une méthode pour les 24 questions</h3><ol><li>Lis les bornes, le type de réponse attendu et les données disponibles.</li><li>Dans un extrait, suis les affectations et les retours avant de prédire l’affichage.</li><li>Pour le code, identifie le contexte : script, corps de classe ou corps de méthode.</li><li>Vérifie les $, les ;, les accolades, les indices et les appels -> / ::.</li><li>En MVC, nomme la responsabilité avant de choisir le fichier.</li></ol></section><section class="sheet-section"><h3>Les coquilles du cours à ne pas recopier</h3><ul><li>Constructeur et destructeur : __construct / __destruct, avec deux underscores.</li><li>Propriété statique : self::$planete, avec le dollar.</li><li>Le getter du numéro est getNum ; une diapositive écrit getNom par erreur.</li><li>Prix > 0 ou prix >= 0 : applique le contrat de l’énoncé. Les diapositives 41 et 43 du chapitre 1 diffèrent.</li><li>Le constructeur parent n’est pas syntaxiquement obligé d’être la première instruction PHP ; c’est la convention suivie par le cours.</li><li>liberer() est défini dans GestionConnexion, pas dans PDO ; une affectation $_db locale ne remplit pas $this->_db.</li></ul></section></article>`;}
function sheetPage(id,all=false){return heading('FICHES DE RÉVISION',all?'Les cinq fiches à emporter.':id==='all'?'L’essentiel avant l’examen.':e(chapters.find(c=>c.id===Number(id))?.short||'Fiche'), 'Des définitions, des exemples commentés et les erreurs à éviter.',btn('Imprimer / Enregistrer en PDF','print',''))+(all?globalSheet()+chapters.map(sheetContent).join(''):id==='all'?globalSheet():chapters.find(c=>c.id===Number(id))?sheetContent(chapters.find(c=>c.id===Number(id))):missing());}
function settingsPage(){return heading('TON APPAREIL, TES DONNÉES','Garder une trace de tes progrès.','La progression est enregistrée dans ce navigateur, sans compte ni transmission à un serveur.')+`<div class="two-col">${panel('Sauvegarder et restaurer',`<p>Exporte régulièrement un fichier JSON pour transférer tes résultats ou conserver une copie.</p><div class="stack">${btn('Exporter ma progression en JSON','export','primary')}<label class="btn file-button">Importer une progression<input type="file" id="import-file" accept="application/json,.json"></label></div><p class="muted">L’import remplace les données locales après vérification et confirmation. Le chronomètre d’une session importée garde sa date de départ.</p>`)}${panel('Préférences',`<form id="prefs"><label>Apparence<select name="theme"><option value="light" ${state.prefs.theme==='light'?'selected':''}>Clair</option><option value="dark" ${state.prefs.theme==='dark'?'selected':''}>Sombre</option></select></label><label>Durée d’examen par défaut (minutes)<input name="duration" type="number" min="1" max="180" value="${state.prefs.duration}" required></label><div class="form-grid"><label>Poids QCM<input name="qcmWeight" type="number" min="0.25" max="20" step="0.25" value="${state.prefs.qcmWeight}" required></label><label>Poids code<input name="codeWeight" type="number" min="0.25" max="20" step="0.25" value="${state.prefs.codeWeight}" required></label></div><button class="btn primary" type="submit">Enregistrer les préférences</button></form>`)}</div>${panel('Comprendre les résultats',`<p>Une réponse multiple vaut juste uniquement si toutes les bonnes propositions sont sélectionnées, sans proposition incorrecte. Aucune pénalité négative. Le code est auto-évalué à 0 %, 50 % ou 100 % du poids de l’exercice.</p><p>La maîtrise exige trois bonnes réponses consécutives par question. Une réponse de code partielle reste une notion à retravailler. Le taux global comprend les essais évalués, y compris les réponses non saisies d’une session remise.</p><p>Les moyennes d’examens incluent uniquement les copies dont le code est entièrement évalué. L’historique conserve les 100 dernières sessions ; les compteurs de questions restent cumulatifs.</p><p>Raccourcis en session : 1 à 4 pour les choix, flèches gauche/droite pour naviguer, M pour marquer et Entrée pour valider en correction immédiate. Dans l’éditeur, Tab indente et Entrée reprend l’indentation.</p>`)}${panel('Sources et périmètre',`<p>Contenu rédigé à partir des quatre PowerPoint fournis : 48, 32, 34 et 50 diapositives. Chaque question cite son chapitre et ses diapositives.</p><p>Structure et ergonomie inspirées de <a href="https://aloyslrtg.github.io/ccna-lab/" target="_blank" rel="noopener">CCNA Lab</a>. Aucune question réseau n’est utilisée.</p><p>Cette application ne prédit pas les questions de l’examen. Son indicateur de préparation sert à orienter les révisions.</p>`)}${panel('Repartir de zéro',`<p>Efface les résultats, les favoris, les préférences et la session sauvegardée. Exporte tes données si tu souhaites les garder.</p>${btn('Réinitialiser ma progression','reset','danger')}`)}`;}
function missing(){return heading('PAGE INTROUVABLE','Revenons au programme.','Cette page n’existe pas.',link('Tableau de bord','dashboard','btn primary'));}
function render(){route=(location.hash.replace(/^#\/?/,'')||'dashboard').replace(/\/$/,'');shell();const [page,arg]=route.split('/');document.body.classList.remove('menu-open');let content;switch(page){case'dashboard':content=dashboard();break;case'chapter':content=chapterPage(Number(arg));break;case'exam':case'custom':case'code':content=setupPage(page);break;case'errors':content=errorsPage();break;case'express':content=expressPage();break;case'sheets':content=sheetsPage();break;case'sheet':content=sheetPage(arg);break;case'print':content=sheetPage('all',true);break;case'settings':content=settingsPage();break;case'session':content=sessionPage();break;case'results':content=resultPage();break;default:content=missing();}main.innerHTML=content;document.title=`${main.querySelector('h1')?.textContent||'Révisions'} · PHP Lab`;if(page==='session')mountSession();if(['custom','code'].includes(page))updateAvailable();}
function toggleFavorite(id){state.favorites=state.favorites.includes(id)?state.favorites.filter(x=>x!==id):[...state.favorites,id];persist();}
function choose(option){const s=state.current;if(!s||s.status!=='active')return;const q=byId.get(s.items[s.index].id);if(q.type==='code'||s.revealed.includes(q.id))return;const a=s.answers[q.id]||[];s.answers[q.id]=q.type==='multiple'?(a.includes(option)?a.filter(x=>x!==option):[...a,option]):[option];persist();render();main.querySelector(`[data-option="${option}"]`)?.focus();}
function move(index){const s=state.current;if(!s||s.status!=='active')return;s.index=Math.min(s.items.length-1,Math.max(0,index));persist();render();main.querySelector('.question h2')?.scrollIntoView({block:'nearest'});}
function checkAnswer(){const s=state.current;if(!s||!s.immediate||s.status!=='active')return;const q=byId.get(s.items[s.index].id);if(s.revealed.includes(q.id))return;if(!isAnswered(q,s.answers[q.id])){toast(q.type==='code'?'Écris une réponse avant de consulter la correction.':'Choisis une réponse avant de valider.');return;}s.revealed.push(q.id);if(q.type!=='code')recordAttempt(state,s,q,exactAnswer(q,s.answers[q.id]));persist();render();}
function grade(id,value){const s=state.current,q=byId.get(id);if(!s||!q||q.type!=='code'||s.grades[id]!==undefined||!([0,.5,1].includes(value))||!(s.status==='submitted'||s.immediate&&s.revealed.includes(id)))return;s.grades[id]=value;recordAttempt(state,s,q,value===1);if(s.status==='submitted')archiveSession(state,s);persist();render();if(route==='results')document.getElementById(`result-${id}`)?.scrollIntoView({block:'nearest'});}
function mark(){const s=state.current;if(!s||s.status!=='active')return;const id=s.items[s.index].id;s.marked=s.marked.includes(id)?s.marked.filter(x=>x!==id):[...s.marked,id];if(s.marked.includes(id)){if(!state.favorites.includes(id))state.favorites.push(id);}else{state.favorites=state.favorites.filter(x=>x!==id);}persist();render();}
function startExpress(){const errors=stats(bank,state).errors.map(q=>q.id),selected=[];for(const c of chapters){for(const code of [false,true]){const pool=shuffle(bank.filter(q=>q.chapter===c.id&&(q.type==='code')===code));pool.sort((a,b)=>(errors.includes(b.id)?10:0)+(b.essential?1:0)-(errors.includes(a.id)?10:0)-(a.essential?1:0));selected.push(...pool.slice(0,code?1:2));}}begin(makeSession(selected,{mode:'express',title:'Révision express',immediate:true,weights:{qcm:1,code:5}}));}
document.addEventListener('click',async event=>{if(event.target.closest('.skip')){event.preventDefault();main.focus();main.scrollIntoView();return;}const target=event.target.closest('[data-action]');if(!target)return;const action=target.dataset.action,s=state.current,id=target.dataset.id;
 switch(action){case'menu':document.body.classList.toggle('menu-open');$('.mobile-menu')?.setAttribute('aria-expanded',document.body.classList.contains('menu-open'));break;case'theme':state.prefs.theme=state.prefs.theme==='dark'?'light':'dark';persist();shell();break;case'answer':choose(target.dataset.option);break;case'prev':move(s.index-1);break;case'next':move(s.index+1);break;case'goto':move(Number(target.dataset.index));break;case'mark':mark();break;case'check':checkAnswer();break;case'hint':if(s?.immediate&&!s.hints.includes(s.items[s.index].id)){s.hints.push(s.items[s.index].id);persist();render();}break;case'submit':await submitSession();break;case'grade':grade(id,Number(target.dataset.grade));break;case'chapter-start':{const c=Number(target.dataset.chapter),kind=target.dataset.kind,pool=shuffle(bank.filter(q=>q.chapter===c&&(kind==='code'?q.type==='code':q.type!=='code')));await begin(makeSession(kind==='qcm'?pool.slice(0,10):pool,{mode:'chapter',title:`Chapitre ${c} · ${kind==='code'?'code':'QCM'}`,immediate:true}));break;}case'error-tab':errorTab=target.dataset.tab;render();break;case'errors-start':{const items=errorTab==='favorites'?bank.filter(q=>state.favorites.includes(q.id)):stats(bank,state).errors;if(items.length)await begin(makeSession(items,{mode:'errors',title:'Révision des erreurs',immediate:true}));break;}case'retry-one':await begin(makeSession([byId.get(id)],{mode:'errors',title:'Une notion à consolider',immediate:true}));break;case'favorite':toggleFavorite(id);render();break;case'show-correction':{if(state.current?.status==='active'&&state.current.mode==='exam'){toast('Termine ton examen pour accéder aux corrections de la banque.');break;}const q=byId.get(id),mock=makeSession([q],{});mock.answers={};mock.grades[q.id]=0;document.getElementById(`review-${id}`).innerHTML=correction(q,mock);target.disabled=true;break;}case'express-start':startExpress();break;case'print':window.print();break;case'print-all':location.hash='/print';break;case'export':{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`php-lab-progression-${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Progression exportée.');break;}case'reset':if(await confirmDialog('Effacer la progression ?', 'Tous les résultats et la session locale seront effacés. Un export JSON permet de les conserver.','Réinitialiser')){state=freshState();persist();render();toast('Progression réinitialisée.');}break;case'history':{const h=state.history.find(x=>x.id===id);if(h){if(state.current?.status==='active'&& !await confirmDialog('Ouvrir ce résultat ?', 'La session active sera remplacée. Annule pour la reprendre.','Ouvrir'))break;state.current=JSON.parse(JSON.stringify(h));persist();location.hash='/results';if(route==='results')render();}break;}}
});
document.addEventListener('submit',async event=>{const form=event.target;if(form.id==='setup'){event.preventDefault();const c=getConfig(form);if(c.mode==='exam'){state.prefs.duration=c.duration;state.prefs.qcmWeight=c.weights.qcm;state.prefs.codeWeight=c.weights.code;persist();const lastExam=[...state.history].reverse().find(s=>s.mode==='exam');await begin(generateExam(bank,{...c,previousIds:lastExam?.items.map(i=>i.id)}));}else{const pool=selectQuestions(bank,c);if(!pool.length){toast('Sélectionne au moins un chapitre et des critères avec des questions disponibles.');return;}await begin(makeSession(shuffle(pool).slice(0,Math.min(c.count,pool.length)),{...c,title:c.mode==='code'?'Entraînement au code':'QCM personnalisé'}));}}else if(form.id==='prefs'){event.preventDefault();const f=new FormData(form);state.prefs={theme:f.get('theme'),duration:Number(f.get('duration')),qcmWeight:Number(f.get('qcmWeight')),codeWeight:Number(f.get('codeWeight'))};persist();render();toast('Préférences enregistrées.');}});
document.addEventListener('change',async event=>{if(event.target.closest('#setup'))updateAvailable();if(event.target.id==='import-file'){const file=event.target.files[0];if(!file)return;try{if(file.size>5e6)throw new Error('Le fichier dépasse 5 Mo.');const imported=validateState(JSON.parse(await file.text()),byId);if(await confirmDialog('Restaurer cette progression ?', 'La sauvegarde importée remplacera les résultats et la session de ce navigateur.','Importer')){state=imported;persist();render();toast('Progression restaurée.');}}catch(err){toast(`Import refusé : ${err.message}`);}}});
document.addEventListener('input',event=>{if(event.target.closest('#setup'))updateAvailable();});
document.addEventListener('keydown',event=>{if($('#dialog').open||event.ctrlKey||event.metaKey||event.altKey||['INPUT','TEXTAREA','SELECT'].includes(event.target.tagName))return;if(event.key==='Escape'){document.body.classList.remove('menu-open');return;}if(route!=='session'||!state.current||state.current.status!=='active')return;const s=state.current;if(event.key==='ArrowLeft'){event.preventDefault();move(s.index-1);}else if(event.key==='ArrowRight'){event.preventDefault();move(s.index+1);}else if(event.key.toLowerCase()==='m'){event.preventDefault();mark();}else if(event.key==='Enter'&&event.target===document.body){event.preventDefault();checkAnswer();}else if(/^[1-4]$/.test(event.key)){const option=s.items[s.index].order[Number(event.key)-1];if(option!==undefined){event.preventDefault();choose(option);}}});
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0);main.focus({preventScroll:true});});
window.addEventListener('pagehide',()=>state&&persist());
setInterval(()=>{const s=state?.current;if(!s||s.status!=='active')return;if(s.duration&&remainingSeconds(s)===0){submitSession(true);return;}const t=$('#session-timer');if(t)t.textContent=time(s.duration?remainingSeconds(s):elapsedSeconds(s));},1000);
async function init(){try{const data=PHP_LAB_EMBEDDED;chapters=data[0];bank=data.slice(1).flat();byId=new Map(bank.map(q=>[q.id,q]));state=loadState(byId);render();if(state.current?.status==='active'&&state.current.duration&&remainingSeconds(state.current)===0)await submitSession(true);}catch(err){main.innerHTML=heading('OUVERTURE DU SITE','Le programme n’a pas pu être chargé.',e(err.message))+panel('Lancer le site localement','<p>Depuis le dossier php-lab, lance <code>python3 -m http.server 8080</code>, puis ouvre <a href="http://localhost:8080">http://localhost:8080</a>. L’ouverture directe en file:// ne permet pas de charger les fichiers JSON.</p>');}}
init();

</script></body></html>
